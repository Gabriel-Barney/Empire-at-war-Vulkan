# The required check for every pull request into main (docs/GROUND_UP_WORKFLOW_DESIGN.md "Evidence and integration").
# One aggregate status, "landing", succeeds only when the jobs the change needs report success for this candidate:
#   docs-only change  -> docs   (doc-reference lint)
#   anything else     -> engine (pinned MSVC toolchain, dev.cmd doctor, dev.cmd check --preset fast = build with /WX
#                                through sccache, or with the shared PCH when a pull request has no cache to restore,
#                                and the synthetic suite)
# Retail, Vulkan and trace evidence is a recorded local run, never hosted CI (docs/DECISIONS.md "Retail and GPU
# evidence is a recorded local run").
name: landing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. A push to main never cancels one: main's run is what saves
# the toolchain and compiler caches that every pull request restores (a cancelled run saves neither).
concurrency:
  group: landing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: windows-2025
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # tools/gate.py (self-test: CTest alamo_gate_selftest) prints each path's class, writes code=true|false, and
      # puts the head, base and tested merge candidate (github.sha) in the step summary.
      - id: paths
        name: Classify changed paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CANDIDATE: ${{ github.sha }}
        run: python -I tools/gate.py classify --event "$EVENT" --base "$BASE" --head "$HEAD" --candidate "$CANDIDATE"

  docs:
    needs: classify
    if: needs.classify.outputs.code == 'false'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Doc-reference lint
        run: |
          python -I tools/lint/check_doc_refs.py --root .
          python -I tools/lint/check_doc_refs.py --selftest

  engine:
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    # sccache caches compiles across runs; CMake reads the launcher variables from the environment at configure time,
    # and dev.cmd passes the environment through. With a launcher set, the shared PCH defaults OFF (docs/DECISIONS.md
    # "Build speed"). The check step sets the launcher only when the "mode" step chooses sccache.
    env:
      SCCACHE_CACHE_SIZE: 3G
      ALAMO_SCCACHE_VERSION: v0.19.0
    steps:
      - uses: actions/checkout@v7
      # The runner context is not available in a job's env, so SCCACHE_DIR is set here.
      - name: Point sccache at the runner's temp directory
        shell: bash
        run: echo "SCCACHE_DIR=$RUNNER_TEMP\\sccache" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: ${{ env.ALAMO_SCCACHE_VERSION }}
      # One cache entry per commit. A run restores its own ref's newest entry, else main's; caches saved on a pull
      # request are visible only to that pull request, so main's push runs are what seed every new pull request.
      # The key carries the sccache version and the toolchain setup scripts' hash: after either changes, an old cache
      # would only miss, so nothing is restored and the "mode" step can see that the build is cold.
      - id: sccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\sccache
          key: sccache-engine-${{ env.ALAMO_SCCACHE_VERSION }}-${{ hashFiles('toolchain/*.cmd', 'toolchain/*.sh', 'toolchain/*.py') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: sccache-engine-${{ env.ALAMO_SCCACHE_VERSION }}-${{ hashFiles('toolchain/*.cmd', 'toolchain/*.sh', 'toolchain/*.py') }}-
      # A cold sccache build (every compile a miss, PCH off) took ~37 min on the hosted runner; the PCH build without
      # sccache takes ~22 min. So a pull request with nothing to restore builds with the PCH and saves no compiler
      # cache. A push to main always builds through sccache, even cold, because its cache seeds every pull request.
      - id: mode
        name: Choose sccache or the shared PCH
        shell: bash
        env:
          MATCHED: ${{ steps.sccache.outputs.cache-matched-key }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$MATCHED" ] || [ "$EVENT" = push ]; then use=true; else use=false; fi
          echo "sccache=$use" >> "$GITHUB_OUTPUT"
          echo "restored: ${MATCHED:-nothing}; event: $EVENT; build through sccache: $use"
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # The pinned toolchain (MSVC 14.51, SDK 28000, CMake, Ninja, Vulkan headers, DXC, validation layers, Lua,
      # miniaudio, FFmpeg, FidelityFX, XeSS; no Rust) is keyed on the setup scripts and the Python that owns the venv.
      - id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: toolchain
          key: toolchain-engine-${{ steps.python.outputs.python-version }}-${{ hashFiles('toolchain/*.cmd', 'toolchain/*.sh', 'toolchain/*.py') }}
      - name: Install the pinned toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: cmd
        # --accept-msvc-license: the Visual Studio license is accepted for CI installs (approved by Gabriel, 2026-11-21).
        run: |
          call toolchain\2_setup.cmd --engine-only --accept-msvc-license || exit /b 1
          if exist toolchain\downloads rmdir /s /q toolchain\downloads
      - name: Save the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: toolchain
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Register the validation layer for the elevated Vulkan loader
        shell: pwsh
        # Hosted runners run elevated, and the Vulkan loader ignores VK_LAYER_PATH in an elevated process, so the GPU
        # tests' strict "the pinned layer must load" check failed. Register the pinned layer where an elevated loader
        # looks (HKLM ExplicitLayers); the runner is discarded after the job.
        run: |
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $loader = Get-Item "$env:WINDIR\System32\vulkan-1.dll" -ErrorAction SilentlyContinue
          Write-Host "elevated: $admin; system Vulkan loader: $(if ($loader) { $loader.VersionInfo.FileVersion } else { 'none' })"
          $json = Join-Path $env:GITHUB_WORKSPACE 'toolchain\vvl\bin\VkLayer_khronos_validation.json'
          if (-not (Test-Path $json)) { throw "missing $json" }
          $key = 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name $json -Value 0 -PropertyType DWord -Force | Out-Null
          Write-Host "registered $json"
      - name: dev.cmd doctor
        shell: cmd
        run: call .\dev.cmd doctor --engine-only
      - name: dev.cmd check --preset fast
        shell: cmd
        env:
          USE_SCCACHE: ${{ steps.mode.outputs.sccache }}
        run: |
          if "%USE_SCCACHE%"=="true" (
            set "CMAKE_C_COMPILER_LAUNCHER=sccache"
            set "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          )
          call .\dev.cmd check --preset fast
      - name: Report
        if: always()
        shell: bash
        run: |
          for f in build/test-results/report-synthetic.md build/logs/dev-last.json; do
            [ -f "$f" ] || continue
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$f" == *.json ]]; then echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            else cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      # Stopping the server flushes the cache directory before it is saved, and prints the hit rate.
      - name: sccache stats
        if: ${{ always() && steps.mode.outputs.sccache == 'true' }}
        shell: bash
        run: |
          { echo '### sccache'; echo '```'; sccache --stop-server || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # A PCH build leaves the cache directory empty; saving it would hand the pull request's next run an empty cache
      # that counts as restored, so that run would build cold through sccache.
      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' && steps.mode.outputs.sccache == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: landing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results/
            build/logs/
          if-no-files-found: warn
          retention-days: 14

  landing:
    needs: [classify, docs, engine]
    if: always()
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # Fails unless the job this change needs reports success; a skipped, cancelled, failed or missing result fails
      # with the job named (tools/gate.py aggregate, self-test CTest alamo_gate_selftest).
      - name: Aggregate result
        shell: bash
        env:
          CLASSIFY: ${{ needs.classify.result }}
          CODE: ${{ needs.classify.outputs.code }}
          DOCS: ${{ needs.docs.result }}
          ENGINE: ${{ needs.engine.result }}
        run: python -I tools/gate.py aggregate --classify "$CLASSIFY" --code "$CODE" --docs "$DOCS" --engine "$ENGINE"
