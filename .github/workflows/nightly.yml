# The expensive MSVC checks, nightly and on demand (docs/DECISIONS.md "MSVC is the only compiler"; #10 decision 3).
# Not required on pull requests. Each preset's dated last-passing commit is kept in the issue titled
# "Nightly checks: last passing" (tools/nightly_record.py); a failed run leaves that row as it was and fails here.
#   analyze -> dev.cmd check --preset analyze: build with MSVC /analyze, fail on a finding not in
#              tests/analyze_baseline.txt (tools/analyze_report.py)
#   asan    -> dev.cmd check --preset asan: build with MSVC AddressSanitizer, run the synthetic suite
name: nightly

on:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false  # one preset failing does not cancel the other
      matrix:
        preset: [analyze, asan]
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # The same pinned toolchain and cache key as landing.yml, so this restores the entry main's landing run saved.
      - id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: toolchain
          key: toolchain-engine-${{ steps.python.outputs.python-version }}-${{ hashFiles('toolchain/*.cmd', 'toolchain/*.sh', 'toolchain/*.py') }}
      - name: Install the pinned toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: cmd
        # --accept-msvc-license: the Visual Studio license is accepted for CI installs (approved by Gabriel, 2026-11-21).
        run: |
          call toolchain\2_setup.cmd --engine-only --accept-msvc-license || exit /b 1
          if exist toolchain\downloads rmdir /s /q toolchain\downloads
      - name: dev.cmd doctor
        shell: cmd
        run: call .\dev.cmd doctor --engine-only
      # The GPU tests in the suite need the pinned validation layer, which an elevated loader finds only in HKLM
      # (the same step as landing.yml).
      - name: Register the validation layer for the elevated Vulkan loader
        if: matrix.preset == 'asan'
        shell: pwsh
        run: |
          $json = Join-Path $env:GITHUB_WORKSPACE 'toolchain\vvl\bin\VkLayer_khronos_validation.json'
          if (-not (Test-Path $json)) { throw "missing $json" }
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers' -Name $json -Value 0 -PropertyType DWord -Force | Out-Null
      - name: dev.cmd check --preset ${{ matrix.preset }}
        shell: cmd
        run: call .\dev.cmd check --preset ${{ matrix.preset }}
      - name: Report
        if: always()
        shell: bash
        run: |
          f=build/logs/dev-last.json
          [ -f "$f" ] || exit 0
          { echo "### ${{ matrix.preset }}: $f"; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/logs/
            build-asan/test-results/
          if-no-files-found: warn
          retention-days: 30

  # Only main's commits are recorded: a manual run on another branch checks it but does not touch the record.
  record:
    needs: [check]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    permissions:
      actions: read  # each matrix leg's own result, from this run
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Update "Nightly checks: last passing"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # "check (analyze)" -> analyze=<conclusion>; a leg that never ran is recorded as missing.
          results=$(gh run view "$RUN_ID" --json jobs -q '[.jobs[] | select(.name | startswith("check (")) | (.name | ltrimstr("check (") | rtrimstr(")")) + "=" + (.conclusion // "missing")] | join(",")')
          for p in analyze asan; do case ",$results," in *",$p="*) ;; *) results="$results,$p=missing";; esac; done
          RESULTS="${results#,}"
          title="Nightly checks: last passing"
          n=$(gh issue list --state all --limit 1000 --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$n" ]; then
            n=$(gh issue create --title "$title" --body "" | awk -F/ '{print $NF}')
          fi
          gh issue view "$n" --json body -q .body > "$RUNNER_TEMP/body.md"
          python -I tools/nightly_record.py update --body-file "$RUNNER_TEMP/body.md" --results "$RESULTS" \
            --sha "$SHA" --date "$(date -u +%F)" --run "$RUN" > "$RUNNER_TEMP/new.md"
          gh issue edit "$n" --body-file "$RUNNER_TEMP/new.md"
          echo "updated #$n ($RESULTS)"; cat "$RUNNER_TEMP/new.md" >> "$GITHUB_STEP_SUMMARY"
